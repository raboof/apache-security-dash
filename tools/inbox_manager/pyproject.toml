[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inbox_manager"
version = "0.1.0"
requires-python = ">=3.13"
license = "Apache-2.0"
authors = [
    { name = "ASF Security Team", email = "security@apache.org" },
]
dependencies = [
    "dotenv",
    # The inline-prefill prompts (input_with_prefill) need GNU readline; the
    # uv-managed standalone interpreters link the stdlib readline against
    # libedit, where the startup hook is a no-op. gnureadline ships GNU readline.
    "gnureadline",
    "imapclient",
    "markdown-it-py",
    "nh3",
    "pyyaml",
    "whimsy-lookup",
]

[tool.uv.sources]
whimsy-lookup = { path = "../whimsy_lookup", editable = true }

[project.scripts]
inbox-manager = "inbox_manager.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/inbox_manager"]
