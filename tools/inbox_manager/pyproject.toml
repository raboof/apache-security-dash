[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inbox_manager"
version = "0.1.0"
requires-python = ">=3.13"
license = "Apache-2.0"
authors = [
    { name = "ASF Security Team", email = "security@apache.org" },
]
dependencies = [
    "beautifulsoup4",
    "dotenv",
    # The inline-prefill prompts (input_with_prefill) need GNU readline; the
    # uv-managed standalone interpreters link the stdlib readline against
    # libedit, where the startup hook is a no-op. gnureadline ships GNU readline.
    "gnureadline",
    # To get https://github.com/mjs/imapclient/pull/647
    # before post-3.1.0 versino is released
    "imapclient @ git+https://github.com/mjs/imapclient@2f5947cc420c48faac6f9dd7af78ae63465537c9",
    "markdown-it-py",
    "nh3",
    # The report-cache/ storage: the triage state (status, disposition, labels)
    # this tool acts on, read through report_cache rather than off disk.
    "report-cache",
    "whimsy-lookup",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.uv.sources]
report-cache = { path = "../report_cache", editable = true }
whimsy-lookup = { path = "../whimsy_lookup", editable = true }

[project.scripts]
inbox-manager = "inbox_manager.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/inbox_manager"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
