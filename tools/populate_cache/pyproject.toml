[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "populate-cache"
version = "0.1.0"
description = "Ingest new security reports from the Gmail security inbox via the read-only Gmail API into report-cache/<date>/<pmc>/, leaving labelling and disposition to the triage-populate-cache SKILL."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
authors = [
    { name = "ASF Security Team", email = "security@apache.org" },
]
keywords = ["apache", "asf", "security", "triage", "gmail"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Security",
]
dependencies = [
    # Read-only Gmail API client + its OAuth2 credentials, and .env loading
    # for the credentials (gmail.py).
    "google-api-python-client",
    "google-auth",
    "dotenv",
    # HTML-email -> Markdown conversion for the bundle body (email_utils.py).
    "markdownify",
    # report.md / index.json storage: Header + Entry + the PMC guess (cli.py).
    "report-cache",
    # Committee-info mapping (slug -> entry) for PMC routing (pmc.py).
    "whimsy-lookup",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
populate-cache = "populate_cache.cli:main"

[project.urls]
"Source" = "https://github.com/apache/security/tree/main/tools/populate_cache"
"Issues" = "https://github.com/apache/security/issues"

[tool.uv.sources]
report-cache = { path = "../report_cache", editable = true }
whimsy-lookup = { path = "../whimsy_lookup", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/populate_cache"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
