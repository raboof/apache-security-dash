[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "model-pr"
version = "0.1.0"
description = "Open threat-model / discoverability (AGENTS.md -> SECURITY.md -> model) PRs on Apache PMC repos in one invocation."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "ASF Security Team", email = "security@apache.org" },
]
keywords = ["apache", "asf", "security", "glasswing", "threat-model"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
model-pr = "model_pr.cli:main"

[project.urls]
"Source" = "https://github.com/apache/security/tree/main/tools/model_pr"
"Issues" = "https://github.com/apache/security/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/model_pr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
