[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "report-cache"
version = "0.1.0"
description = "The single owner of report-cache/ storage: read/write report.md bundles and the shared index.json. A CLI for the triage-populate-cache SKILL (move, set, classify) and a Python API for populate-cache and inbox-manager."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
authors = [
    { name = "ASF Security Team", email = "security@apache.org" },
]
keywords = ["apache", "asf", "security", "triage", "report-cache"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Security",
]
dependencies = [
    # report.md front-matter (de)serialisation (report_md.py).
    "pyyaml",
    # Header / Attachment value classes with type-narrowing field converters (report_md.py).
    "attrs",
    # Address-only PMC guessing from To/Cc headers (index.py).
    "whimsy-lookup",
    # Attachment rendering for the agent CLI (render.py):
    # HTML -> Markdown, and PDF -> text.
    "markdownify",
    "pypdf",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
report-cache = "report_cache.cli:main"

[project.urls]
"Source" = "https://github.com/apache/security/tree/main/tools/report_cache"
"Issues" = "https://github.com/apache/security/issues"

[tool.uv.sources]
whimsy-lookup = { path = "../whimsy_lookup", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/report_cache"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
