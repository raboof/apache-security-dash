[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "form-submitter"
version = "0.1.0"
description = "Scan-submission helper that fills the vendor's project-enrollment Google Form (one per repo, OSSF-criticality-ordered) for a PMC. Playwright-driven against a persistent Chromium profile."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
authors = [
    { name = "ASF Security Team", email = "security@apache.org" },
]
keywords = ["apache", "asf", "security", "glasswing", "playwright"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Security",
]
dependencies = [
    "google-api-python-client>=2.0",
    "google-auth>=2.0",
    "playwright>=1.45",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
form-submitter = "form_submitter.cli:main"

[project.urls]
"Source" = "https://github.com/apache/security/tree/main/tools/form_submitter"
"Issues" = "https://github.com/apache/security/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/form_submitter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
