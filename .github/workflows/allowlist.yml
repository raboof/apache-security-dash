---
name: allowlist

# Fail fast on workflow edits that introduce an action ref outside the
# ASF Infrastructure approved-actions allowlist
# (apache/infrastructure-actions/approved_patterns.yml). When a non-
# allowlisted ref slips in, GitHub itself returns `startup_failure`
# with 0-second runs and no logs — this check turns that into an
# actionable PR failure with the offending refs listed.

on:  # yamllint disable-line rule:truthy
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"

permissions: {}

jobs:
  allowlist:
    name: ASF approved-actions allowlist
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - uses: apache/infrastructure-actions/allowlist-check@137df70ba4de7fae2be7f41d200844f8d3705946  # main 2026-05
        with:
          scan-glob: ".github/**/*.yml"
