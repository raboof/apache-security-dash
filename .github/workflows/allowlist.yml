---
name: allowlist

# Fail fast on workflow edits that introduce an action ref outside the
# ASF Infrastructure approved-actions allowlist
# (apache/infrastructure-actions/approved_patterns.yml). When a non-
# allowlisted ref slips in, GitHub itself returns `startup_failure`
# with 0-second runs and no logs — this check turns that into an
# actionable PR failure with the offending refs listed.

# Not path-filtered: `allowlist` is a required status check (.asf.yaml), and a
# required check must always report — a path-filtered workflow never runs on
# PRs that don't touch `.github/**`, leaving the required check pending forever.
# The job is a single cheap scan, so it just runs on every PR rather than
# needing a changes-gate. The job name is left to default to `allowlist` so the
# required-checks context matches `prek` / `tests-ok`.
on:  # yamllint disable-line rule:truthy
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  allowlist:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - uses: apache/infrastructure-actions/allowlist-check@137df70ba4de7fae2be7f41d200844f8d3705946  # main 2026-05
        with:
          scan-glob: ".github/**/*.yml"
