---
name: tests

on:  # yamllint disable-line rule:truthy
  pull_request:
    # Only fire when the tests' inputs actually change. Avoids re-running
    # the whole matrix on doc-only or skill-config-only PRs.
    paths:
      - "tools/**"
      - ".github/workflows/tests.yml"
  push:
    branches: [main]
    paths:
      - "tools/**"
      - ".github/workflows/tests.yml"

permissions: {}

jobs:
  jira-writer:
    name: jira-writer (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b  # v7.3.0
        with:
          enable-cache: true
          # Cache key includes the project's lock state if any.
          cache-dependency-glob: |
            tools/jira_writer/pyproject.toml

      - name: Pin Python interpreter
        run: uv python install ${{ matrix.python-version }}

      - name: Install jira-writer with test extras
        working-directory: tools/jira_writer
        run: uv sync --extra test --python ${{ matrix.python-version }}

      - name: Run pytest
        working-directory: tools/jira_writer
        run: uv run --python ${{ matrix.python-version }} pytest -ra
