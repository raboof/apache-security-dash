---
name: tests

on:  # yamllint disable-line rule:truthy
  pull_request:
    # Only fire when test inputs actually change. Avoids re-running
    # the matrix on doc-only or skill-config-only PRs.
    paths:
      - "tools/**"
      - ".github/workflows/tests.yml"
  push:
    branches: [main]
    paths:
      - "tools/**"
      - ".github/workflows/tests.yml"

permissions: {}

jobs:
  pytest:
    # Matrix over (project, python-version). Add a new project by
    # appending its directory name to `project`; the rest of the
    # workflow runs identically against it. Failures are isolated
    # so one project's regression doesn't mask another.
    name: ${{ matrix.project }} (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        project:
          - jira_writer
          - whimsy_lookup
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      # Pin matches the ASF Infrastructure approved-actions allowlist
      # (apache/infrastructure-actions/approved_patterns.yml). Bump only
      # to another SHA in that file.
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            tools/${{ matrix.project }}/pyproject.toml

      - name: Pin Python interpreter
        run: uv python install ${{ matrix.python-version }}

      - name: Install with test extras
        working-directory: tools/${{ matrix.project }}
        run: uv sync --extra test --python ${{ matrix.python-version }}

      - name: Run pytest
        working-directory: tools/${{ matrix.project }}
        run: uv run --python ${{ matrix.python-version }} pytest -ra
