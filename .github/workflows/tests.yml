---
name: tests

on:  # yamllint disable-line rule:truthy
  pull_request:
  push:
    branches: [main]

# The workflow itself is NOT path-filtered: `tests-ok` is a required status
# check (.asf.yaml), and a required check must ALWAYS report — a path-filtered
# workflow simply never runs on doc-only / SKILL-only PRs, so the required
# check would stay pending forever and block the merge. Instead the cheap
# `changes` job below decides whether the expensive matrix runs; `tests-ok`
# always runs and reports.

permissions: {}

jobs:
  # Cheap gate: did anything that affects the Python test matrix change?
  # Keeps the old "don't re-run the matrix on doc-only PRs" optimisation
  # without path-filtering the whole workflow (see the note above).
  changes:
    name: detect test-relevant changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - id: filter
        env:
          BASE: >-
            ${{ github.event_name == 'pull_request'
                && github.event.pull_request.base.sha
                || github.event.before }}
        run: |
          # Unknown base (first push, force-push, shallow clone) → run the
          # matrix rather than risk skipping a real change.
          if [ -z "$BASE" ] \
              || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
              || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE" HEAD \
              | grep -qE '^tools/|^\.github/workflows/tests\.yml$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  pytest:
    # Matrix over (project, python-version). Add a new project by
    # appending its directory name to `project`; the rest of the
    # workflow runs identically against it. Failures are isolated
    # so one project's regression doesn't mask another.
    name: ${{ matrix.project }} (py${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        project:
          - jira_writer
          - whimsy_lookup
          - form_submitter
          - sheets_writer
          - model_pr
          - populate_cache
          - report_cache
          - inbox_manager
        # Single supported interpreter. Widen this list to re-introduce a
        # cross-version matrix; nothing else in the workflow needs to change.
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Pin matches the ASF Infrastructure approved-actions allowlist
      # (apache/infrastructure-actions/approved_patterns.yml). Bump only
      # to another SHA in that file.
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            tools/${{ matrix.project }}/pyproject.toml

      - name: Pin Python interpreter
        run: uv python install ${{ matrix.python-version }}

      - name: Install with test extras
        working-directory: tools/${{ matrix.project }}
        run: uv sync --extra test --python ${{ matrix.python-version }}

      - name: Run pytest
        working-directory: tools/${{ matrix.project }}
        run: uv run --python ${{ matrix.python-version }} pytest -ra

  # Single aggregating status check. Branch protection (.asf.yaml) requires
  # `tests-ok` instead of every (project, python) matrix leg by name — so the
  # matrix can grow without touching the required-checks list. Runs always
  # (even when the matrix is skipped or a leg fails) so the check is always
  # reported; passes when the matrix succeeded or was legitimately skipped,
  # fails if the changes gate errored or any matrix leg failed/was cancelled.
  tests-ok:
    name: tests-ok
    if: always()
    needs: [changes, pytest]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require the matrix to pass (or be skipped)
        env:
          CHANGES: ${{ needs.changes.result }}
          MATRIX: ${{ needs.pytest.result }}
        run: |
          echo "changes=$CHANGES  pytest=$MATRIX"
          if [ "$CHANGES" != "success" ]; then
            echo "::error::changes gate did not succeed ($CHANGES)"
            exit 1
          fi
          case "$MATRIX" in
            success|skipped) echo "tests-ok"; exit 0 ;;
            *) echo "::error::pytest matrix did not pass ($MATRIX)"; exit 1 ;;
          esac
