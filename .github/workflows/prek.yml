---
name: prek

on:  # yamllint disable-line rule:truthy
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  prek:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # `uv` brings its own Python and is required by two of the
      # local hooks (`ruff-check-sheets-writer`,
      # `ruff-format-sheets-writer`) which invoke `uvx ruff`. It also
      # hosts the `prek` install below.
      # Pin matches the ASF Infrastructure approved-actions allowlist
      # (apache/infrastructure-actions/approved_patterns.yml). Bump only
      # to another SHA in that file; an unlisted SHA fails the workflow
      # with `startup_failure` before any step runs.
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true

      # Install prek via uv so the install lives in the cached uv
      # tool dir between runs.
      - name: Install prek
        run: uv tool install prek

      - name: Run prek
        run: prek run --show-diff-on-failure --color=always --all-files
