---
name: prek

on:  # yamllint disable-line rule:truthy
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  prek:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      # `uv` brings its own Python and is required by two of the
      # local hooks (`ruff-check-sheets-writer`,
      # `ruff-format-sheets-writer`) which invoke `uvx ruff`. It also
      # hosts the `prek` install below.
      - uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b  # v7.3.0
        with:
          enable-cache: true

      # Install prek via uv so the install lives in the cached uv
      # tool dir between runs.
      - name: Install prek
        run: uv tool install prek

      - name: Run prek
        run: prek run --show-diff-on-failure --color=always --all-files
