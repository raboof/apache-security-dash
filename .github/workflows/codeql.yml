---
name: codeql

# CodeQL Python scan over `.github/skills/**/*.py` (the inline PEP-723
# helpers) and `tools/**/*.py` (the promoted projects). Findings land
# in the repo's Security tab.

on:  # yamllint disable-line rule:truthy
  pull_request:
    paths:
      - ".github/skills/**/*.py"
      - "tools/**/*.py"
      - ".github/workflows/codeql.yml"
  push:
    branches: [main]
    paths:
      - ".github/skills/**/*.py"
      - "tools/**/*.py"
      - ".github/workflows/codeql.yml"
  # Weekly baseline scan independent of code changes — keeps drift
  # against newly-released CodeQL queries from accumulating silently.
  schedule:
    - cron: "22 4 * * 4"

permissions: {}

jobs:
  analyze:
    name: CodeQL Python analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
      # Required by github/codeql-action/init for the
      # overlay-database caching path on PR runs — without it
      # the action fails with "Resource not accessible by
      # integration" against the workflow-runs API.
      actions: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@84498526a009a99c875e83ef4821a8ba52de7c22  # codeql-bundle-v2.25.5
        with:
          languages: python
          # Build mode `none` skips the build step entirely — our
          # Python code is library-shaped (no compilation), so CodeQL
          # can analyse the source tree directly.
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@84498526a009a99c875e83ef4821a8ba52de7c22  # codeql-bundle-v2.25.5
        with:
          category: "/language:python"
