---
name: zizmor

# Static analysis for GitHub Actions workflows. Catches the classes
# of issue the allowlist check can't — injection sinks (
# `${{ github.event.pull_request.title }}` flowing into `run:`),
# dangerous-checkout patterns, overly permissive `permissions:`
# blocks, etc. Findings upload as SARIF so they show up in the
# repo's Security tab alongside CodeQL.

on:  # yamllint disable-line rule:truthy
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"

permissions: {}

jobs:
  zizmor:
    name: zizmor static analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      # ASF-allowlisted pin (zizmorcore/zizmor-action v0.5.6).
      #
      # Annotations mode (no SARIF upload). The default SARIF-upload
      # path needs GitHub Advanced Security / Code Scanning enabled
      # on the repository — apache/security doesn't have that on
      # today, so the upload step fails with "Code Security must be
      # enabled". When/if Code Scanning gets turned on (via .asf.yaml
      # or ASF infra ticket), flip `advanced-security: true` and
      # `annotations: false`, restore `security-events: write` +
      # `actions: read` permissions, and findings will surface in
      # the Security tab. Until then, annotations show inline on
      # PR file diffs which is enough for review-time feedback.
      - uses: zizmorcore/zizmor-action@5f14fd08f7cf1cb1609c1e344975f152c7ee938d  # v0.5.6
        with:
          advanced-security: "false"
          annotations: "true"
