---
name: zizmor

# Static analysis for GitHub Actions workflows. Catches the classes
# of issue the allowlist check can't — injection sinks (
# `${{ github.event.pull_request.title }}` flowing into `run:`),
# dangerous-checkout patterns, overly permissive `permissions:`
# blocks, etc. Findings upload as SARIF so they show up in the
# repo's Security tab alongside CodeQL.

on:  # yamllint disable-line rule:truthy
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"

permissions: {}

jobs:
  zizmor:
    name: zizmor static analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Upload SARIF results into the repo's Security tab.
      security-events: write
      # Required by the SARIF upload path (github/codeql-action/
      # upload-sarif under the hood) — without it the upload
      # fails with "Resource not accessible by integration".
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      # ASF-allowlisted pin (zizmorcore/zizmor-action v0.5.6).
      - uses: zizmorcore/zizmor-action@5f14fd08f7cf1cb1609c1e344975f152c7ee938d  # v0.5.6
