# Dependabot config:
#   * github-actions  — keeps SHA-pinned workflow refs current with
#                       upstream tag releases. Bumps need to land on
#                       ASF-approved SHAs; if Dependabot proposes one
#                       outside the allowlist the `allowlist` workflow
#                       fails the PR.
#   * pip / tools/*   — keeps runtime + test deps of each promoted
#                       project current. New projects added under
#                       tools/ need a new entry here.

version: 2

updates:
  # GitHub Actions across .github/workflows/ and .github/actions/.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
    # Cooldown — wait 7 days after upstream release before
    # opening a bump PR. Lets the release shake out any
    # last-minute breakage before we ratchet onto it. The
    # github-actions ecosystem only supports `default-days`
    # (action tags aren't semver-shaped, so per-semver-step
    # cooldown values are rejected by Dependabot validation).
    cooldown:
      default-days: 7

  # tools/jira_writer — Apache JIRA write helper.
  - package-ecosystem: pip
    directory: "/tools/jira_writer"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(jira_writer)"
    labels:
      - dependencies
      - python
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3

  # tools/form_submitter — Playwright-driven Google Form filler.
  - package-ecosystem: pip
    directory: "/tools/form_submitter"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(form_submitter)"
    labels:
      - dependencies
      - python
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3

  # tools/sheets_writer — Google Sheets writer for the Glasswing tracker.
  - package-ecosystem: pip
    directory: "/tools/sheets_writer"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(sheets_writer)"
    labels:
      - dependencies
      - python
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
