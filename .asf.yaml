github:
  features:
    issues: true
  # Branch protection for main. `contexts` are the CI status checks that must
  # pass before a PR can merge. All three always report on every PR:
  #   - prek      : the prek workflow has no path filter, so it runs on all PRs.
  #   - tests-ok  : the tests workflow's aggregating job runs always (even when
  #                 the Python matrix is skipped on doc-only PRs), so the check
  #                 is always present and never deadlocks a merge.
  #   - allowlist : the approved-actions check; also un-path-filtered so it
  #                 always reports.
  # Requiring the single `tests-ok` aggregate (rather than each project/python
  # matrix leg) means the matrix can grow without editing this list.
  protected_branches:
    main:
      required_status_checks:
        # Don't force every PR to be rebased onto the latest main before merge.
        strict: false
        contexts:
          - prek
          - tests-ok
          - allowlist

# Route every GitHub notification stream to the private commits list.
#
# This block only takes effect on the default branch (main).

notifications:
  commits: commits-private@security.apache.org
  issues: commits-private@security.apache.org
  pullrequests: commits-private@security.apache.org
  jobs: commits-private@security.apache.org
  discussions: commits-private@security.apache.org
