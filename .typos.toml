# typos configuration for apache/security.
#
# See https://github.com/crate-ci/typos for the spec.

[default]
# Use the generic English locale rather than `en-us` or `en-gb`. The
# repo's prose is mixed (both "behavior" / "behaviour", "artifacts" /
# "artefacts", etc. appear across SKILL docs + README). Switching from
# `en-us` to `en` means typos won't flag either variant — it only
# catches true misspellings with no regional alternative. If the team
# later wants to normalize on one variant, that's a focused follow-up
# PR; for now both are accepted.
locale = "en"

[default.extend-words]
# Project / program names + ASF terms that aren't typos.
PMC = "PMC"
PMCs = "PMCs"
ASF = "ASF"
ODF = "ODF"
Glasswing = "Glasswing"
Mythos = "Mythos"
Magpie = "Magpie"
Scovetta = "Scovetta"
Karwasz = "Karwasz"
Mirko = "Mirko"
Svilus = "Svilus"
ponymail = "ponymail"
Whimsy = "Whimsy"
# Spreadsheet A1 column letters — `BA` is column 53. typos otherwise
# flags it as a misspelling of `BY` / `BE`.
BA = "BA"
# Commands without their 'highlighted' letter
isplay = "isplay"
# Gmail IMAP extension attribute names (X-GM-MSGID / X-GM-THRID); `THRID`
# otherwise reads as a misspelling of `THIRD`.
THRID = "THRID"
MSGID = "MSGID"
# LDAP Access Control Information / Item (Apache Directory term), not a
# misspelling of `ACPI`. Recurs in directory-* threat-model + scan docs.
ACI = "ACI"
ACIs = "ACIs"

[default.extend-identifiers]
# Commit SHA fragments referenced in SKILL doc provenance sections.
# typos tokenises substrings inside short hex strings (e.g. `afe`
# inside `fa6afe5`) and flags them as misspellings of real words;
# listing the full identifier here keeps it intact. Add more as
# additional commit refs land in the docs.
fa6afe5 = "fa6afe5"

[files]
extend-exclude = [
  # SKILL files quote PMC member names + email addresses verbatim
  # from inbound requests; spell-checking them is too noisy.
  "scans/**",
  # Generated thread permalinks in the spreadsheet snapshots (if any
  # land here later).
  "*.tracker.txt",
  # Vendored Apache Magpie framework content — the gitignored snapshot
  # and the one committed framework skill (`magpie-setup`), now canonical
  # at `.agents/skills/magpie-setup/` (relayed into `.claude` / `.github`).
  # Upstream prose is spell-checked in apache/airflow-steward and reconciled
  # here by `/magpie-setup upgrade`, so we don't hand-edit it to satisfy our
  # local typos config (e.g. legitimate hyphenated "mis-apply").
  ".apache-magpie/**",
  ".agents/skills/magpie-setup/**",
]
